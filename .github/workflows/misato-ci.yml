name: misato-ci

on:
  push:
    branches:
      - misato-hermes-live-brain
      - misato-full-build
      - main
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Regression checks
        run: npm run misato:regression

      - name: Desktop packaging verification
        run: npm run misato:desktop-packaging-check

      - name: Desktop build
        run: npm run desktop:build

      - name: Upload desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misato-desktop-artifacts
          path: |
            src-tauri/target/release/misato-desktop.exe
            src-tauri/target/release/bundle/nsis/MISATO_0.1.0_x64-setup.exe
          if-no-files-found: warn
